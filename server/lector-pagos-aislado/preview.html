<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector aislado - Pagos (Google Sheets)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#1a1a1a;color:#fff;padding:14px 18px}
header small{color:#bbb}
.bar{padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-bottom:1px solid #ddd}
input{padding:8px;border:1px solid #ccc;border-radius:6px;min-width:280px}
input.gid{min-width:140px}
button{padding:8px 14px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#estado{padding:10px 18px;font-size:14px}
#meta{padding:0 18px 8px;font-size:13px;color:#555}
.wrap{overflow:auto;max-height:70vh;margin:0 18px 30px;background:#fff;border:1px solid #ddd}
table{border-collapse:collapse;width:max-content;min-width:100%}
td,th{border:1px solid #ddd;padding:6px 10px;font-size:13px;white-space:nowrap}
tr:first-child td{background:#fafafa;font-weight:700}
.error{background:#ffe3e3;border:1px solid #e99;padding:12px;margin:12px 18px;border-radius:8px;font-size:14px}
.hint{background:#fff8dd;border:1px solid #e6cf6a;padding:12px;margin:12px 18px;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<header><b>Lector aislado de pagos</b> <small>Lee Google Sheets tal cual &middot; no usa tu sistema &middot; solo muestra</small></header>
<div class="bar">
<input id="sheetId" placeholder="sheetId" value="1_HoKXfiAggbq5uRHNIjWkSj0ZJtqEdsc">
<input id="gid" class="gid" placeholder="gid" value="2127928750">
<button id="btn" onclick="cargar()">Cargar hoja</button>
</div>
<div id="estado">Pega el link y pulsa Cargar. Puedes cambiar el gid para otra pestaña.</div>
<div id="meta"></div>
<div class="wrap"><table id="tabla"></table></div>
<script>
function extraerDeLink(){
const v=document.getElementById('sheetId').value.trim();
const m=v.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
if(m) document.getElementById('sheetId').value=m[1];
const g=v.match(/gid=(\d+)/);
if(g) document.getElementById('gid').value=g[1];
}
async function cargar(){
extraerDeLink();
const sheetId=document.getElementById('sheetId').value.trim();
const gid=document.getElementById('gid').value.trim();
const est=document.getElementById('estado'),meta=document.getElementById('meta'),tab=document.getElementById('tabla');
document.getElementById('btn').disabled=true;
est.textContent='Leyendo Google Sheets...';meta.textContent='';tab.innerHTML='';
document.querySelectorAll('.error,.hint').forEach(e=>e.remove());
try{
const r=await fetch(`api/preview?sheetId=${encodeURIComponent(sheetId)}&gid=${encodeURIComponent(gid)}`);
const j=await r.json();
if(!j.ok){
const d=document.createElement('div');d.className='error';d.textContent=j.error;est.after(d);
if(j.code==='SHEET_PRIVADO'){
const h=document.createElement('div');h.className='hint';
h.innerHTML='<b>Cómo hacerlo público (1 min):</b> abre el Google Sheet &rarr; botón <b>Compartir</b> &rarr; Acceso general: <b>Cualquiera con el enlace</b> &rarr; rol <b>Lector</b> &rarr; Listo. Luego pulsa Cargar de nuevo. Ellos siguen editando en Google, tu sistema solo lee.';
d.after(h);
}
est.textContent='No se pudo leer.';
}else{
est.textContent='Hoja cargada tal cual.';
meta.textContent=`Filas: ${j.totalFilas} · Columnas: ${j.totalCols} · gid: ${j.gid}`;
tab.innerHTML=j.filas.map(f=>`<tr>${f.map(c=>`<td>${String(c??'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('');
}
}catch(e){est.textContent='Error de red: '+e.message}
document.getElementById('btn').disabled=false;
}
cargar();
</script>
</body>
</html>
