server {
    listen 80;
    server_name api.universidadsigloxxi.com;

    # Redirect all HTTP to HTTPS (Certbot agregara esto automaticamente)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.universidadsigloxxi.com;

    # SSL - Certbot configurara esto automaticamente
    # ssl_certificate /etc/letsencrypt/live/api.universidadsigloxxi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.universidadsigloxxi.com/privkey.pem;

    # Tamanos maximos para subida de archivos
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Proxy reverso a Node.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Archivos estaticos uploads (servidos directamente por Nginx)
    location /uploads/ {
        alias /opt/plataforma/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend React (backup en el VPS)
    location /plataforma/ {
        alias /opt/plataforma/server/build/;
        try_files $uri $uri/ /plataforma/index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
